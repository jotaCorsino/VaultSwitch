name: Publicar beta Valt Switch

on:
  push:
    branches: [main]
    paths:
      - 'VaultSwitch.html'
      - 'GUIA-TESTES-BETA.md'
      - 'RELEASE-NOTES-v0.1.0-beta.2.md'
      - '.github/workflows/publicar-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testes completos
        run: node --test tests/*.test.js
      - name: Gerar ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          folder = Path("dist")
          folder.mkdir(exist_ok=True)
          name = "Valt-Switch-v0.1.0-beta.2.zip"
          mapping = {
              "VaultSwitch.html": "Valt-Switch.html",
              "GUIA-TESTES-BETA.md": "LEIA-ME.md",
              "LICENSE-ICONES-TABLER.txt": "LICENSE-ICONES-TABLER.txt",
          }
          with zipfile.ZipFile(folder / name, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for src, dest in mapping.items():
                  z.write(src, "Valt-Switch/" + dest)
          with zipfile.ZipFile(folder / name) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == 3
              assert b"_review/" not in z.read("Valt-Switch/Valt-Switch.html")
          digest = hashlib.sha256((folder / name).read_bytes()).hexdigest()
          (folder / (name + ".sha256")).write_text(digest + "  " + name + "\n",encoding="utf-8")
          print(f"SHA-256 {digest}")
          PY
      - name: Publicar GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-beta.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existente."
            exit 0
          fi
          gh release create "$TAG" \
            dist/Valt-Switch-v0.1.0-beta.2.zip \
            dist/Valt-Switch-v0.1.0-beta.2.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Valt Switch v0.1.0-beta.2 — Testes" \
            --notes-file RELEASE-NOTES-v0.1.0-beta.2.md \
            --prerelease
